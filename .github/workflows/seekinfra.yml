# Generated by SeekInfra. Builds the image and applies infra/seekinfra in your AWS account,
# using SeekInfraDeployRole through GitHub OIDC (no AWS keys are stored anywhere).
name: SeekInfra

on:
  # Every push to the default branch redeploys the app (code or infra); docs-only pushes don't.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      action:
        description: deploy, stop or start
        type: choice
        options: [deploy, stop, start]
        default: deploy

permissions:
  id-token: write
  contents: read

concurrency:
  group: seekinfra-cp360
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  APP_NAME: cp360
  NAME: seekinfra-cp360
  TF_DIR: infra/seekinfra
  BUILD_CONTEXT: backend
  DESIRED_COUNT: "1"

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assume SeekInfraDeployRole
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::881447930884:role/SeekInfraDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare Terraform state bucket
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="seekinfra-tfstate-${ACCOUNT}-${AWS_REGION}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform init
        run: >-
          terraform -chdir="$TF_DIR" init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$APP_NAME/terraform.tfstate"
          -backend-config="region=$AWS_REGION"
          -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform -chdir="$TF_DIR" validate

      - name: Create image registry
        run: terraform -chdir="$TF_DIR" apply -input=false -auto-approve -target=aws_ecr_repository.app

      - name: Build and push image
        run: |
          set -euo pipefail
          REPO=$(terraform -chdir="$TF_DIR" output -raw ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build -t "$REPO:$GITHUB_SHA" "$BUILD_CONTEXT"
          docker push "$REPO:$GITHUB_SHA"

      - name: Provision infrastructure
        run: terraform -chdir="$TF_DIR" apply -input=false -auto-approve -var "image_tag=$GITHUB_SHA"

      - name: Wait for the service to be healthy
        run: aws ecs wait services-stable --cluster "$NAME" --services "$NAME"

      - name: Publish URL
        run: echo "### Live at $(terraform -chdir="$TF_DIR" output -raw url)" >> "$GITHUB_STEP_SUMMARY"

  stop:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'stop'
    runs-on: ubuntu-latest
    steps:
      - name: Assume SeekInfraDeployRole
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::881447930884:role/SeekInfraDeployRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Scale the service to zero
        run: aws ecs update-service --cluster "$NAME" --service "$NAME" --desired-count 0 > /dev/null
      - name: Stop the database
        run: |
          if aws rds describe-db-instances --db-instance-identifier "$NAME" > /dev/null 2>&1; then
            aws rds stop-db-instance --db-instance-identifier "$NAME" > /dev/null || true
          fi

  start:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Assume SeekInfraDeployRole
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::881447930884:role/SeekInfraDeployRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Start the database
        run: |
          if aws rds describe-db-instances --db-instance-identifier "$NAME" > /dev/null 2>&1; then
            aws rds start-db-instance --db-instance-identifier "$NAME" > /dev/null || true
            aws rds wait db-instance-available --db-instance-identifier "$NAME"
          fi
      - name: Scale the service up
        run: |
          aws ecs update-service --cluster "$NAME" --service "$NAME" --desired-count "$DESIRED_COUNT" > /dev/null
          aws ecs wait services-stable --cluster "$NAME" --services "$NAME"
